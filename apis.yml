description: >-
  Arcade.dev (formerly Arcade AI) is the MCP runtime for production AI agents — a platform that lets agents safely take
  real-world actions across SaaS apps with per-user authorization, governed tool execution, and audit logging. The
  Arcade Engine exposes a Tools API for listing / authorizing / executing agent tools, an Authorization API that brokers
  OAuth and API-key grants across 40+ providers, an OpenAI-compatible LLM endpoint, Workers and MCP Gateways for
  routing, Hooks for governance, and an Admin API for control-plane configuration. Arcade ships with 7,000+ pre-built
  integrations across Google, Microsoft, Slack, GitHub, Salesforce, HubSpot, and more, plus an MCP server framework
  (arcade-mcp) and SDKs in Python, TypeScript, Go, Java/Kotlin, and .NET. Available as Arcade Cloud, VPC, on-prem, or
  air-gapped.
