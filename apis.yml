apis:
  - aid: arcade-dev:arcade-tools-api
    name: Arcade Tools API
    tags:
      - Tools
      - Agents
      - AI
      - Execution
    humanURL: https://docs.arcade.dev/references/api
    properties:
      - url: https://docs.arcade.dev/home/tools
        type: Documentation
      - url: openapi/arcade-tools-api-openapi.yml
        type: OpenAPI
      - url: json-schema/arcade-tool-schema.json
        type: JSONSchema
      - url: json-schema/arcade-tool-execution-schema.json
        type: JSONSchema
      - url: json-structure/arcade-tool-structure.json
        type: JSONStructure
      - url: examples/arcade-tools-list-example.json
        type: Examples
      - url: examples/arcade-tools-execute-example.json
        type: Examples
      - url: examples/arcade-tools-authorize-example.json
        type: Examples
    description: >-
      List, inspect, authorize, execute, and schedule Arcade tools. Tools are user-scoped agent actions addressed by
      fully qualified name (Toolkit.Name@version) and executed against a stable user_id with Arcade-managed
      authorization tokens.
  - aid: arcade-dev:arcade-auth-api
    name: Arcade Authorization API
    tags:
      - Authorization
      - OAuth
      - Identity
      - Agents
    humanURL: https://docs.arcade.dev/home/auth
    properties:
      - url: https://docs.arcade.dev/home/auth
        type: Documentation
      - url: openapi/arcade-auth-api-openapi.yml
        type: OpenAPI
      - url: json-schema/arcade-authorization-schema.json
        type: JSONSchema
      - url: json-structure/arcade-authorization-structure.json
        type: JSONStructure
      - url: examples/arcade-auth-authorize-example.json
        type: Examples
      - url: examples/arcade-auth-status-example.json
        type: Examples
    description: >-
      Authorize end-users against 40+ identity providers (Google, Microsoft, Slack, GitHub, Salesforce, HubSpot, and
      more). Issue user-scoped grants, poll authorization status, and confirm users so agents can call tools as the
      end-user rather than a shared service account.
  - aid: arcade-dev:arcade-llm-api
    name: Arcade LLM API
    tags:
      - LLM
      - AI
      - Chat
      - OpenAI Compatible
    humanURL: https://docs.arcade.dev/home/chat-overview
    properties:
      - url: https://docs.arcade.dev/home/chat-overview
        type: Documentation
      - url: openapi/arcade-llm-api-openapi.yml
        type: OpenAPI
      - url: examples/arcade-llm-chat-completions-example.json
        type: Examples
    description: >-
      OpenAI-compatible chat completions endpoint that lets agents call LLMs through Arcade with tools attached. The
      engine handles tool selection, end-user authorization, and tool execution so agents need only speak the OpenAI
      Chat Completions protocol.
  - aid: arcade-dev:arcade-workers-api
    name: Arcade Workers API
    tags:
      - Workers
      - MCP
      - Infrastructure
      - Agents
    humanURL: https://docs.arcade.dev/home/workers
    properties:
      - url: https://docs.arcade.dev/home/workers
        type: Documentation
      - url: openapi/arcade-workers-api-openapi.yml
        type: OpenAPI
      - url: json-schema/arcade-worker-schema.json
        type: JSONSchema
      - url: json-structure/arcade-worker-structure.json
        type: JSONStructure
      - url: examples/arcade-workers-create-example.json
        type: Examples
    description: >-
      Register, manage, health-check, and authorize workers that host Arcade toolkits or MCP servers behind the Arcade
      Engine. Self-hosted workers let customers keep tool execution (and end-user tokens) inside their own perimeter.
  - aid: arcade-dev:arcade-gateways-api
    name: Arcade Gateways API
    tags:
      - Gateways
      - MCP
      - Agents
    humanURL: https://docs.arcade.dev/guides/mcp-gateways
    properties:
