        type: Documentation
      - url: openapi/arcade-gateways-api-openapi.yml
        type: OpenAPI
      - url: examples/arcade-gateways-create-example.json
        type: Examples
    description: >-
      Create and manage MCP gateways scoped to organizations and projects. Gateways expose curated tool catalogs to MCP
      clients (Cursor, Claude Desktop, Claude Code, VS Code, Microsoft Copilot Studio, GitHub Copilot).
  - aid: arcade-dev:arcade-hooks-api
    name: Arcade Hooks API
    tags:
      - Hooks
      - Webhooks
      - Events
      - Agents
    humanURL: https://docs.arcade.dev/guides/audit-logs
    properties:
      - url: https://docs.arcade.dev/guides/audit-logs
        type: Documentation
      - url: openapi/arcade-hooks-api-openapi.yml
        type: OpenAPI
      - url: json-schema/arcade-hook-schema.json
        type: JSONSchema
      - url: examples/arcade-hooks-create-example.json
        type: Examples
    description: >-
      Manage lifecycle hooks that fire on tool authorization, tool execution, worker health, and audit events. Hooks are
      the primary integration point for SIEM forwarding, audit logging, and downstream governance pipelines.
  - aid: arcade-dev:arcade-admin-api
    name: Arcade Admin API
    tags:
      - Administrative
      - Secrets
      - Identity
      - Agents
    humanURL: https://docs.arcade.dev/references/api
    properties:
