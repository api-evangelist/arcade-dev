naftiko: 1.0.0-alpha2
info:
  label: Arcade Tools API
  description: Arcade Tools API capability. Self-contained Naftiko capability covering the Arcade Engine's Tools surface.
  tags:
  - Arcade
  - Tools
  - Agents
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    ARCADE_API_KEY: ARCADE_API_KEY
capability:
  consumes:
  - type: http
    namespace: arcade-tools
    baseUri: https://api.arcade.dev
    description: Arcade Engine Tools business capability. Self-contained, no shared references.
    resources:
    - name: v1-formatted_tools
      path: /v1/formatted_tools
      operations:
      - name: toolslistformatted
        method: GET
        description: Arcade List Formatted Static Tools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: toolkit
          in: query
          type: string
          description: Toolkit name
        - name: limit
          in: query
          type: integer
          description: 'Number of items to return (default: 25, max: 100)'
        - name: offset
          in: query
          type: integer
          description: 'Offset from the start of the list (default: 0)'
        - name: format
          in: query
          type: string
          description: Provider format
        - name: user_id
          in: query
          type: string
          description: User ID
        - name: include_all_versions
          in: query
          type: boolean
          description: Include all versions of each tool
        - name: filter
          in: query
          type: string
          description: 'JSON metadata filter. Array fields (service_domains, operations): shorthand array or object with any_of/all_of/none_of
            operators (case-insensitive). Boolean fields: read_only, destructive, idempotent, open_world. Extras: case-sensitive
            key-value subset match.'
    - name: v1-formatted_tools-name
      path: /v1/formatted_tools/{name}
      operations:
      - name: toolspecformatted
        method: GET
        description: Arcade Get Formatted Tool Specification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Tool name
        - name: format
          in: query
          type: string
          description: Provider format
        - name: user_id
          in: query
          type: string
          description: User ID
    - name: v1-scheduled_tools
      path: /v1/scheduled_tools
      operations:
      - name: toolscheduledlist
        method: GET
        description: Arcade List Scheduled Tool Executions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: 'Number of items to return (default: 25, max: 100)'
        - name: offset
          in: query
          type: integer
          description: 'Offset from the start of the list (default: 0)'
    - name: v1-scheduled_tools-id
      path: /v1/scheduled_tools/{id}
      operations:
      - name: toolscheduledget
        method: GET
        description: Arcade Get Scheduled Tool Execution Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Scheduled execution ID
    - name: v1-tools
      path: /v1/tools
      operations:
      - name: toolsliststatic
        method: GET
        description: Arcade List Static Tools
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: toolkit
          in: query
          type: string
          description: Toolkit name
        - name: limit
          in: query
          type: integer
          description: 'Number of items to return (default: 25, max: 100)'
        - name: offset
          in: query
          type: integer
          description: 'Offset from the start of the list (default: 0)'
        - name: include_format
          in: query
          type: array
          description: Comma separated tool formats that will be included in the response.
        - name: user_id
          in: query
          type: string
          description: User ID
        - name: include_all_versions
          in: query
          type: boolean
          description: Include all versions of each tool
        - name: filter
          in: query
          type: string
          description: 'JSON metadata filter. Array fields (service_domains, operations): shorthand array or object with any_of/all_of/none_of
            operators (case-insensitive). Boolean fields: read_only, destructive, idempotent, open_world. Extras: case-sensitive
            key-value subset match.'
    - name: v1-tools-authorize
      path: /v1/tools/authorize
      operations:
      - name: toolauthorize
        method: POST
        description: Arcade Authorize Tool
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-tools-execute
      path: /v1/tools/execute
      operations:
      - name: toolexecute
        method: POST
        description: Arcade Execute Tool
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-tools-requirements
      path: /v1/tools/requirements
      operations:
      - name: toolrequirements
        method: POST
        description: Arcade Check Tool Requirements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-tools-name
      path: /v1/tools/{name}
      operations:
      - name: toolspec
        method: GET
        description: Arcade Get Arcade Tool Specification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Tool name
        - name: include_format
          in: query
          type: array
          description: Comma separated tool formats that will be included in the response.
        - name: user_id
          in: query
          type: string
          description: User ID
  tools:
  - name: arcade-toolslistformatted
    description: Arcade List Formatted Static Tools
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-tools.toolslistformatted
    outputParameters:
    - type: object
      mapping: $.
    with:
      toolkit: tools.toolkit
      limit: tools.limit
      offset: tools.offset
      format: tools.format
      user_id: tools.user_id
      include_all_versions: tools.include_all_versions
      filter: tools.filter
  - name: arcade-toolspecformatted
    description: Arcade Get Formatted Tool Specification
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-tools.toolspecformatted
    outputParameters:
    - type: object
      mapping: $.
    with:
      name: tools.name
      format: tools.format
      user_id: tools.user_id
  - name: arcade-toolscheduledlist
    description: Arcade List Scheduled Tool Executions
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-tools.toolscheduledlist
    outputParameters:
    - type: object
      mapping: $.
    with:
      limit: tools.limit
      offset: tools.offset
  - name: arcade-toolscheduledget
    description: Arcade Get Scheduled Tool Execution Details
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-tools.toolscheduledget
    outputParameters:
    - type: object
      mapping: $.
    with:
      id: tools.id
  - name: arcade-toolsliststatic
    description: Arcade List Static Tools
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-tools.toolsliststatic
    outputParameters:
    - type: object
      mapping: $.
    with:
      toolkit: tools.toolkit
      limit: tools.limit
      offset: tools.offset
      include_format: tools.include_format
      user_id: tools.user_id
      include_all_versions: tools.include_all_versions
      filter: tools.filter
  - name: arcade-toolauthorize
    description: Arcade Authorize Tool
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-tools.toolauthorize
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-toolexecute
    description: Arcade Execute Tool
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-tools.toolexecute
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-toolrequirements
    description: Arcade Check Tool Requirements
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-tools.toolrequirements
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-toolspec
    description: Arcade Get Arcade Tool Specification
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-tools.toolspec
    outputParameters:
    - type: object
      mapping: $.
    with:
      name: tools.name
      include_format: tools.include_format
      user_id: tools.user_id
