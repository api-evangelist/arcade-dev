naftiko: 1.0.0-alpha2
info:
  label: Arcade Plugins API
  description: Arcade Plugins API capability. Self-contained Naftiko capability covering the Arcade Engine's Plugins surface.
  tags:
  - Arcade
  - Plugins
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    ARCADE_API_KEY: ARCADE_API_KEY
capability:
  consumes:
  - type: http
    namespace: arcade-plugins
    baseUri: https://api.arcade.dev
    description: Arcade Engine Plugins business capability. Self-contained, no shared references.
    resources:
    - name: v1-plugins
      path: /v1/plugins
      operations:
      - name: pluginslist
        method: GET
        description: Arcade List Plugins
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Limit
        - name: offset
          in: query
          type: integer
          description: Offset
        - name: binding_type
          in: query
          type: string
          description: Binding type filter (e.g., 'tenant')
      - name: pluginscreate
        method: POST
        description: Arcade Create A Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-plugins-plugin_id
      path: /v1/plugins/{plugin_id}
      operations:
      - name: pluginsget
        method: GET
        description: Arcade Get A Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: plugin_id
          in: path
          type: string
          description: Plugin ID
      - name: pluginsdelete
        method: DELETE
        description: Arcade Delete A Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: plugin_id
          in: path
          type: string
          description: Plugin ID
      - name: pluginsupdate
        method: PATCH
        description: Arcade Update A Plugin
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: plugin_id
          in: path
          type: string
          description: Plugin ID
        - name: body
          in: body
          type: object
          description: Request body.
  tools:
  - name: arcade-pluginslist
    description: Arcade List Plugins
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-plugins.pluginslist
    outputParameters:
    - type: object
      mapping: $.
    with:
      limit: tools.limit
      offset: tools.offset
      binding_type: tools.binding_type
  - name: arcade-pluginscreate
    description: Arcade Create A Plugin
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-plugins.pluginscreate
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-pluginsget
    description: Arcade Get A Plugin
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-plugins.pluginsget
    outputParameters:
    - type: object
      mapping: $.
    with:
      plugin_id: tools.plugin_id
  - name: arcade-pluginsdelete
    description: Arcade Delete A Plugin
    hints:
      readOnly: false
      destructive: true
      idempotent: true
    call: arcade-plugins.pluginsdelete
    outputParameters:
    - type: object
      mapping: $.
    with:
      plugin_id: tools.plugin_id
  - name: arcade-pluginsupdate
    description: Arcade Update A Plugin
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-plugins.pluginsupdate
    outputParameters:
    - type: object
      mapping: $.
    with:
      plugin_id: tools.plugin_id
      body: tools.body
