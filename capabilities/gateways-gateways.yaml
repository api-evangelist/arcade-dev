naftiko: 1.0.0-alpha2
info:
  label: Arcade Gateways API
  description: Arcade Gateways API capability. Self-contained Naftiko capability covering the Arcade Engine's Gateways surface.
  tags:
  - Arcade
  - Gateways
  - MCP
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    ARCADE_API_KEY: ARCADE_API_KEY
capability:
  consumes:
  - type: http
    namespace: arcade-gateways
    baseUri: https://api.arcade.dev
    description: Arcade Engine Gateways business capability. Self-contained, no shared references.
    resources:
    - name: v1-orgs-org_id-projects-project_id-gateways
      path: /v1/orgs/{org_id}/projects/{project_id}/gateways
      operations:
      - name: projectgatewayslist
        method: GET
        description: Arcade List Gateways
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: string
          description: Organization ID
        - name: project_id
          in: path
          type: string
          description: Project ID
        - name: limit
          in: query
          type: integer
          description: 'Number of items to return (default: 25, max: 100)'
        - name: offset
          in: query
          type: integer
          description: 'Offset from the start of the list (default: 0)'
      - name: projectgatewayscreate
        method: POST
        description: Arcade Create A Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: string
          description: Organization ID
        - name: project_id
          in: path
          type: string
          description: Project ID
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-orgs-org_id-projects-project_id-gateways-slug
      path: /v1/orgs/{org_id}/projects/{project_id}/gateways/slug
      operations:
      - name: projectgatewayssluginfo
        method: POST
        description: Arcade Check Gateway Slug Availability
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: string
          description: Organization ID
        - name: project_id
          in: path
          type: string
          description: Project ID
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-orgs-org_id-projects-project_id-gateways-gateway_id
      path: /v1/orgs/{org_id}/projects/{project_id}/gateways/{gateway_id}
      operations:
      - name: projectgatewaysget
        method: GET
        description: Arcade Get A Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: string
          description: Organization ID
        - name: project_id
          in: path
          type: string
          description: Project ID
        - name: gateway_id
          in: path
          type: string
          description: Gateway ID
      - name: projectgatewaysupdate
        method: PUT
        description: Arcade Update A Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: string
          description: Organization ID
        - name: project_id
          in: path
          type: string
          description: Project ID
        - name: gateway_id
          in: path
          type: string
          description: Gateway ID
        - name: body
          in: body
          type: object
          description: Request body.
      - name: projectgatewaysdelete
        method: DELETE
        description: Arcade Delete A Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: string
          description: Organization ID
        - name: project_id
          in: path
          type: string
          description: Project ID
        - name: gateway_id
          in: path
          type: string
          description: Gateway ID
      - name: projectgatewayspatch
        method: PATCH
        description: Arcade Patch A Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
