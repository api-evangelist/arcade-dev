naftiko: 1.0.0-alpha2
info:
  label: Arcade Admin API
  description: Arcade Admin API capability. Self-contained Naftiko capability covering the Arcade Engine's Admin surface.
  tags:
  - Arcade
  - Administrative
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    ARCADE_API_KEY: ARCADE_API_KEY
capability:
  consumes:
  - type: http
    namespace: arcade-admin
    baseUri: https://api.arcade.dev
    description: Arcade Engine Admin business capability. Self-contained, no shared references.
    resources:
    - name: v1-admin-auth_providers
      path: /v1/admin/auth_providers
      operations:
      - name: authproviderslist
        method: GET
        description: Arcade List Auth Providers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: authproviderscreate
        method: POST
        description: Arcade Create An Auth Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-admin-auth_providers-id
      path: /v1/admin/auth_providers/{id}
      operations:
      - name: authprovidersget
        method: GET
        description: Arcade Get An Auth Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the auth provider to get
      - name: authprovidersdelete
        method: DELETE
        description: Arcade Delete An Auth Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the auth provider to delete
      - name: authprovidersupdate
        method: PATCH
        description: Arcade Patch An Auth Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-admin-secrets
      path: /v1/admin/secrets
      operations:
      - name: secretslist
        method: GET
        description: Arcade List Secrets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-admin-secrets-secret_id
      path: /v1/admin/secrets/{secret_id}
      operations:
      - name: secretsdelete
        method: DELETE
        description: Arcade Delete Secret
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: secret_id
          in: path
          type: string
          description: The ID of the secret to delete
    - name: v1-admin-secrets-secret_key
      path: /v1/admin/secrets/{secret_key}
      operations:
      - name: secretsupsert
        method: POST
        description: Arcade Upsert Secret
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: secret_key
          in: path
          type: string
          description: The key of the secret to upsert
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-admin-settings-session_verification
      path: /v1/admin/settings/session_verification
      operations:
      - name: sessionverificationsettingsget
        method: GET
        description: Arcade Get Session Verification Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sessionverificationsettingsupdate
        method: PUT
        description: Arcade Update Session Verification Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
    - name: v1-admin-user_connections
      path: /v1/admin/user_connections
      operations:
      - name: authconnectionslist
        method: GET
        description: Arcade List Auth Connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: provider_id
          in: query
          type: string
          description: Provider ID
        - name: user_id
          in: query
          type: string
          description: User ID
        - name: limit
          in: query
          type: integer
          description: Page size
        - name: offset
          in: query
          type: integer
          description: Page offset
    - name: v1-admin-user_connections-id
      path: /v1/admin/user_connections/{id}
      operations:
      - name: authconnectionsdelete
        method: DELETE
        description: Arcade Delete Auth Connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Connection ID
  tools:
  - name: arcade-authproviderslist
    description: Arcade List Auth Providers
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-admin.authproviderslist
    outputParameters:
    - type: object
      mapping: $.
  - name: arcade-authproviderscreate
    description: Arcade Create An Auth Provider
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-admin.authproviderscreate
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-authprovidersget
    description: Arcade Get An Auth Provider
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-admin.authprovidersget
    outputParameters:
    - type: object
      mapping: $.
    with:
      id: tools.id
  - name: arcade-authprovidersdelete
    description: Arcade Delete An Auth Provider
    hints:
      readOnly: false
      destructive: true
      idempotent: true
    call: arcade-admin.authprovidersdelete
    outputParameters:
    - type: object
      mapping: $.
    with:
      id: tools.id
  - name: arcade-authprovidersupdate
    description: Arcade Patch An Auth Provider
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-admin.authprovidersupdate
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-secretslist
    description: Arcade List Secrets
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-admin.secretslist
    outputParameters:
    - type: object
      mapping: $.
  - name: arcade-secretsdelete
    description: Arcade Delete Secret
    hints:
      readOnly: false
      destructive: true
      idempotent: true
    call: arcade-admin.secretsdelete
    outputParameters:
    - type: object
      mapping: $.
    with:
      secret_id: tools.secret_id
  - name: arcade-secretsupsert
    description: Arcade Upsert Secret
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-admin.secretsupsert
    outputParameters:
    - type: object
      mapping: $.
    with:
      secret_key: tools.secret_key
      body: tools.body
  - name: arcade-sessionverificationsettingsget
    description: Arcade Get Session Verification Settings
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-admin.sessionverificationsettingsget
    outputParameters:
    - type: object
      mapping: $.
  - name: arcade-sessionverificationsettingsupdate
    description: Arcade Update Session Verification Settings
    hints:
      readOnly: false
      destructive: false
      idempotent: true
    call: arcade-admin.sessionverificationsettingsupdate
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
  - name: arcade-authconnectionslist
    description: Arcade List Auth Connections
    hints:
      readOnly: true
      destructive: false
      idempotent: true
    call: arcade-admin.authconnectionslist
    outputParameters:
    - type: object
      mapping: $.
    with:
      provider_id: tools.provider_id
      user_id: tools.user_id
      limit: tools.limit
      offset: tools.offset
  - name: arcade-authconnectionsdelete
    description: Arcade Delete Auth Connection
    hints:
      readOnly: false
      destructive: true
      idempotent: true
    call: arcade-admin.authconnectionsdelete
    outputParameters:
    - type: object
      mapping: $.
    with:
      id: tools.id
