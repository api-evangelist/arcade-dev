naftiko: 1.0.0-alpha2
info:
  label: Arcade LLM API
  description: Arcade LLM API capability. Self-contained Naftiko capability covering the Arcade Engine's LLM surface.
  tags:
  - Arcade
  - LLM
  - Chat
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    ARCADE_API_KEY: ARCADE_API_KEY
capability:
  consumes:
  - type: http
    namespace: arcade-llm
    baseUri: https://api.arcade.dev
    description: Arcade Engine LLM business capability. Self-contained, no shared references.
    resources:
    - name: v1-chat-completions
      path: /v1/chat/completions
      operations:
      - name: llmchat
        method: POST
        description: Arcade Language Model Chat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body.
  tools:
  - name: arcade-llmchat
    description: Arcade Language Model Chat
    hints:
      readOnly: false
      destructive: false
      idempotent: false
    call: arcade-llm.llmchat
    outputParameters:
    - type: object
      mapping: $.
    with:
      body: tools.body
