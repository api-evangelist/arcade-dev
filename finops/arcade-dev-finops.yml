chargeTypes:
  - id: tool-execution-standard
    name: Standard Tool Execution
    chargeCategory: Usage
    pricingUnit: execution
    description: Charge for each invocation of a standard-tier Arcade tool above the included quota.
  - id: tool-execution-pro
    name: Pro Tool Execution
    chargeCategory: Usage
    pricingUnit: execution
    description: Charge for each invocation of a pro-tier Arcade tool above the included quota.
  - id: user-challenge
    name: User Challenge
    chargeCategory: Usage
    pricingUnit: challenge
    description: Charge for each end-user authorization challenge (OAuth or API-key prompt) above the included
      quota.
  - id: hosted-mcp-runtime
    name: Hosted MCP Server Runtime
    chargeCategory: Usage
    pricingUnit: hour
    description: Hourly runtime charge for Arcade-hosted MCP servers above the Hobby allotment.
  - id: subscription-base
    name: Plan Base Fee
    chargeCategory: Purchase
    pricingUnit: month
    description: Monthly base fee for the Growth plan ($25/month). Enterprise base fees are custom.
recommendations:
  - capability: Cost Allocation
    practice: Forward Arcade audit hooks to your data lake to attribute tool executions to specific user_id values
      and downstream business units.
  - capability: Anomaly Management
    practice: Subscribe to tool_execution hooks and alert on sudden growth in pro-tier executions or hosted MCP
      runtime hours.
  - capability: Forecasting
    practice: Track monthly standard vs pro execution ratios and project against the published $0.01 vs $0.50
      unit prices.
  - capability: Rate Optimization
    practice: Co-locate tools onto Arcade-hosted MCP servers to amortize fixed runtime hours across many agents
      rather than spinning up dedicated servers per agent.
