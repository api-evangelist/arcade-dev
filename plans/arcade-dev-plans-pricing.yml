features:
  free:
    - Community support via GitHub
    - 1 Arcade-hosted MCP server, 24/7
    - 7,000+ pre-built integrations and toolkits
    - Python, TypeScript, Go, Java/Kotlin, and .NET SDKs
  growth:
    - Email support with SLA
    - Usage-based overage on challenges, executions, and hosted MCP server runtime
    - Startup program available for companies under 100 employees
  enterprise:
    - Tenant isolation
    - Audit logs forwarded via hooks
    - Role-based access control (RBAC)
    - SSO / SAML
    - Self-hosted and air-gapped deployment options (Cloud, VPC, on-prem)
    - Custom SLA
